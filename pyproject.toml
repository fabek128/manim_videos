[project]
name = "manim_videos"
version = "0.1.0"
description = "Colección de videos y animaciones con Manim"
requires-python = ">=3.12"
dependencies = ["manim>=0.21.0"]

[tool.manim]
# Configuración global de Manim
media_dir = "media"

[tool.ruff.lint]
# Convención oficial de manim: `from manim import *` en las escenas
# (ver AGENTS.md). F403/F405 son ruido para este patrón.
ignore = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "playwright: requiere Chromium instalado (playwright install chromium)",
    "vision: requiere modelo de visión (OPENROUTER_VISION_MODEL / PROMPTGATE_VISION_MODEL)",
]
