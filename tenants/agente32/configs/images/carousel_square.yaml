project_name: "noticia_malaponte_carousel_square"
output_dir: "noticia_malaponte_carousel_square"
format: "carousel_square"
template: "news_carousel"

brand:
  name: "AGENTE E32"
  logo_path: "logos/agente32/agente32.svg"

fonts:
  title: "fonts/Montserrat-ExtraBold.ttf"
  code: "fonts/FiraCode-Regular.ttf"
  body: "fonts/Inter-SemiBold.ttf"

colors:
  text_primary: "#FFFFFF"
  text_secondary: "#D9D9D9"
  highlight_bg: "#0057D9"
  footer_text: "#FFFFFF"
  divider: "#6F86A8"

slides:
  - type: "cover"
    title: "APROBARON EL PLIEGO Y FLORENTINO MALAPONTE SERÁ CAMARISTA FEDERAL DE ROSARIO"
    highlights: ["MALAPONTE", "SERÁ CAMARISTA", "FEDERAL DE ROSARIO"]
    subtitle: "Rosario · Información judicial"
    footer_text: "AGENTE E32"
  - type: "text"
    title: "QUÉ SE APROBÓ"
    body: "El pliego fue aprobado y habilita el nombramiento de Florentino Malaponte como camarista federal de Rosario."
    footer_text: "AGENTE E32"
  - type: "bullets"
    title: "PUNTOS CLAVE"
    bullets:
      - "Nombramiento en la Cámara Federal"
      - "Impacto institucional en Rosario"
      - "Definición política y judicial"
    footer_text: "AGENTE E32"
  - type: "code"
    title: "EJEMPLO DE CÓDIGO"
    code: |
      <code>
      def publicar_noticia(titulo, imagen):
          return renderizar(titulo, imagen)
      </code>
    footer_text: "AGENTE E32"
