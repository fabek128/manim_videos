project_name: "openai_story"
output_dir: "openai_story"
format: "story"
template: "news_card"

brand:
  name: "AGENTE E32"
  logo_path: "logos/agente32/agente32.svg"

fonts:
  title: "fonts/Montserrat-ExtraBold.ttf"
  body: "fonts/Inter-SemiBold.ttf"

colors:
  text_primary: "#FFFFFF"
  text_secondary: "#D9D9D9"
  highlight_bg: "#0057D9"
  footer_text: "#FFFFFF"
  divider: "#6F86A8"

content_slug: "2026-08-31_openai-story"

# Story teaser 9:16 para empujar al post/carrusel ya publicado.
# Zonas seguras 250-1670 respectadas por el template (ver story_teaser.md)
slides:
  - type: "cover"
    title: "OPENAI PAUSA SU IA"
    highlights: ["PAUSA"]
    subtitle: "Post completo en el perfil"
    footer_text: "AGENTE E32"
    entity_logos:
      - "logos/openai/openai_black.svg"
      - "logos/huggingface/huggingface.svg"
    web_capture:
      url: "https://time.com/article/2026/08/26/openai-sam-altman-interview/"
      selector: "img[src*='bltb8c36ec3affa5af3']"
      viewport: [1080, 1920]
      scale: 2
      vision_check: true
      strict_vision: false
